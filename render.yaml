previews:
  generation: off

services:
  - type: web
    name: tempo-api-test
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/dist/server.js
    preDeployCommand: node apps/api/dist/migrate.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # PEM contents of the Supabase project CA (e.g. prod-ca-2021.crt). Required
      # so the self-signed Supabase pooler chain verifies with rejectUnauthorized.
      - key: DATABASE_CA_CERT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: MIGRATE_ON_START
        value: "false"
      - key: DELIVERY_VERIFICATION_SECRET
        generateValue: true
      # Browser CORS allowlist. Native mobile clients do not enforce CORS.
      - key: CORS_ALLOWED_ORIGINS
        value: https://tempo-web-test.onrender.com

  - type: web
    name: tempo-web-test
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand:
      corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @tempo/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_API_URL
        value: https://tempo-api-test.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://pgasgmtqbvmitmwhkxui.supabase.co
      # Publishable key: public by design; the same value ships in the mobile app.
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_NMfOIQ0WXa5kNMtiEfhX0w_fjM-FK9P

  - type: cron
    name: tempo-ingestion-test
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    schedule: "*/15 * * * *"
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    dockerCommand: node apps/ingestion/dist/run.js
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: tempo-api-test
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_CA_CERT
        fromService:
          type: web
          name: tempo-api-test
          envVarKey: DATABASE_CA_CERT

  - type: cron
    name: tempo-intelligence-test
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    schedule: "* * * * *"
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    dockerCommand: node apps/intelligence/dist/run.js
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: tempo-api-test
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_CA_CERT
        fromService:
          type: web
          name: tempo-api-test
          envVarKey: DATABASE_CA_CERT

  - type: cron
    name: tempo-generation-test
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    schedule: "* * * * *"
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    dockerCommand: node apps/generation/dist/run.js
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: tempo-api-test
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_CA_CERT
        fromService:
          type: web
          name: tempo-api-test
          envVarKey: DATABASE_CA_CERT
      # Base origin for briefing links embedded in delivered messages.
      - key: BRIEFING_PUBLIC_BASE_URL
        value: https://tempo-web-test.onrender.com

  - type: cron
    name: tempo-delivery-test
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    schedule: "* * * * *"
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    dockerCommand: node apps/delivery/dist/run.js
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: tempo-api-test
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_CA_CERT
        fromService:
          type: web
          name: tempo-api-test
          envVarKey: DATABASE_CA_CERT
