name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Check Expo dependencies
        run: pnpm --filter @tempo/mobile exec expo install --check

      - name: Export Android bundle
        run:
          pnpm --filter @tempo/mobile exec expo export --platform android
          --output-dir "$RUNNER_TEMP/tempo-android"

      - name: Export iOS bundle
        run:
          pnpm --filter @tempo/mobile exec expo export --platform ios
          --output-dir "$RUNNER_TEMP/tempo-ios"

  container:
    name: Build service image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run:
          docker build --file infrastructure/docker/Dockerfile --tag tempo:test
          .
